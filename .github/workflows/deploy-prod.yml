# This is a basic workflow to help you get started with Actions

name: deploy-prod

# Controls when the workflow will run
on:
    # Production deploys after the deployment branch is updated.
    push:
        branches: ['deploy-prod']

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        steps:
            - name: Deploy
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.HOST_PROD }}
                  username: ${{ secrets.USER_PROD || secrets.USER_PORD }}
                  password: ${{ secrets.PWD_PROD || secrets.PWD_PORD }}
                  port: ${{ secrets.PORT_PROD || secrets.PORT_PORD || '22' }}
                  script: |
                      set -e
                      cd /www/RSSHub
                      if [ ! -d node_modules ]; then
                          echo "RSSHub dependencies are missing from /www/RSSHub/node_modules" >&2
                          exit 1
                      fi
                      git pull --ff-only
                      git rev-parse HEAD
                      nvm use 16
                      node -v
                      node -e "try { require('re2'); require('./lib/app'); process.exit(0) } catch (error) { console.error(error); process.exit(1) }"
                      pm2 restart rsshub
                      pm2 ls
